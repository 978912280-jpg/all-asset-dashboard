name: 每日资产统计与 Pages 部署

# 定时触发交给外部服务 cron-job.org（北京时间每日 23:00 调用 workflow_dispatch，2026-11-13 由 08:15 调整）。
# GitHub 自带 schedule 常延迟/漏跑，故已移除，避免重复运行；只保留手动与外部触发入口。
on:
  repository_dispatch:
    types: [daily]
  workflow_dispatch:
    inputs:
      source:
        description: "触发来源：auto（定时）/ manual（后台手动抓价）"
        required: false
        default: "auto"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 同步 Bitget 成交成本账本
        continue-on-error: true
        env:
          BITGET_KEY: ${{ secrets.BITGET_KEY }}
          BITGET_SECRET: ${{ secrets.BITGET_SECRET }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
        run: python3 scripts/bitget_ledger.py

      - name: 同步 Bitget 账户持仓（现货 + 理财）
        continue-on-error: true
        env:
          BITGET_KEY: ${{ secrets.BITGET_KEY }}
          BITGET_SECRET: ${{ secrets.BITGET_SECRET }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
        run: python3 scripts/bitget_account.py

      - name: 抓取价格并计算资产
        env:
          BUILD_SOURCE: ${{ github.event.inputs.source || 'auto' }}
        run: python3 scripts/build.py

      - name: 推送 Bark 通知
        continue-on-error: true
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python3 scripts/notify_bark.py

      - name: 提交每日快照与仪表盘数据
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STAMP="$(TZ=Asia/Shanghai date +%F)"
          commit_if_any() {
            git add data/dashboard.json data/snapshots.json
            # 成本账本可能因 API 未配置而不存在，单独判断，避免 pathspec 失败导致整次 add 回滚
            if [ -f data/bitget_ledger.json ]; then git add data/bitget_ledger.json; fi
            if [ -f data/bitget_account.json ]; then git add data/bitget_account.json; fi
            if git diff --cached --quiet; then
              echo "数据无变化，跳过提交"
              return 1
            fi
            git commit -m "chore(data): 更新资产快照 $STAMP"
            return 0
          }
          # 其他 workflow（如手动触发）可能刚推送过数据，本地落后会导致 non-fast-forward。
          # 策略：先 rebase 重试；冲突则丢弃 rebase，以 origin/main 为基重新提交我们的构建结果。
          for i in 1 2 3; do
            if ! commit_if_any; then exit 0; fi
            if git pull --rebase origin "${GITHUB_REF_NAME:-main}" && git push; then
              echo "已推送（第 $i 次尝试）"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin "${GITHUB_REF_NAME:-main}"
            # 关键：只保留本次构建出的数据文件，其余文件一律回到远端最新，
            # 否则 reset --soft 会把「旧版页面文件」留在暂存区，跟着数据一起提交，回滚线上代码。
            cp data/dashboard.json /tmp/_dash.json
            cp data/snapshots.json /tmp/_snap.json
            cp data/bitget_ledger.json /tmp/_ledger.json 2>/dev/null || true
            cp data/bitget_account.json /tmp/_acct.json 2>/dev/null || true
            git reset --hard "origin/${GITHUB_REF_NAME:-main}"
            cp /tmp/_dash.json data/dashboard.json
            cp /tmp/_snap.json data/snapshots.json
            cp /tmp/_ledger.json data/bitget_ledger.json 2>/dev/null || true
            cp /tmp/_acct.json data/bitget_account.json 2>/dev/null || true
            echo "第 $i 次推送失败，已重置到远端最新后重试"
            sleep 5
          done
          echo "三次推送均失败，请检查分支保护或权限" >&2
          exit 1

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
