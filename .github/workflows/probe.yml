name: 流水归档试运行（临时）

on:
  workflow_dispatch:
  push:
    branches: [probe/bitget-wallet]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 归档 Bitget 流水
        env:
          BITGET_KEY: ${{ secrets.BITGET_KEY }}
          BITGET_SECRET: ${{ secrets.BITGET_SECRET }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
        run: python3 scripts/bitget_flow.py
      - name: 构建仪表台
        run: python3 scripts/build.py
      - name: 校验产物
        run: python3 scripts/_probe_check.py
