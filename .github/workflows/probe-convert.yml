name: Bitget 闪兑探测（一次性诊断）

on:
  workflow_dispatch:
    inputs:
      days:
        description: "回溯天数"
        required: false
        default: "45"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行探测脚本
        env:
          BITGET_KEY: ${{ secrets.BITGET_KEY }}
          BITGET_SECRET: ${{ secrets.BITGET_SECRET }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
          PROBE_DAYS: ${{ inputs.days }}
        run: python3 scripts/probe_convert.py
